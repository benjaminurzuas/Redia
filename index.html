/* Layout: cuaderno de planificación — encabezado con la semana activa, pestañas por área (abajo en el teléfono), tarjetas de trabajo en grilla */
:root{
  --bg:#f5f6f6; --surface:#ffffff; --surface-2:#f2f4f4; --ink:#151918; --ink-2:#565f5c; --muted:#8c9592; --line:#e7eaea;

  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:16px;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.cloud i{background:var(--good)} .status.saving i{background:var(--warn)} .status.err i{background:var(--bad)}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .lbl{min-width:0;text-align:center;padding:0 6px}
.weeknav .lbl b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.2}
.weeknav .lbl span{font-size:12px;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;padding:0;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink)}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn.quiet{background:none;box-shadow:none;color:var(--muted)}
.iconbtn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--bg)}
.tabs-in{display:flex;gap:4px}
.tabs-in{padding-block:6px}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;border:0;background:none;color:var(--muted);font-weight:500;border-radius:999px}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.tab:hover{color:var(--ink)}
@media (max-width:720px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom, 0px)}
  .tabs-in{justify-content:space-around}
  .tabs-in{padding-block:4px}
  .tab{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;border-radius:12px}
  .tab[aria-selected="true"]{background:none;box-shadow:none;color:var(--accent)}
  .tab svg{width:22px;height:22px}
  main{padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px))}
  .top-row{flex-direction:column;align-items:stretch}
  .weeknav{justify-content:space-between}
}

main{padding-block:20px 48px}
.panel{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(12,minmax(0,1fr))}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
@media (max-width:900px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}}

.card{background:var(--surface);border-radius:var(--r);padding:22px;min-width:0;box-shadow:var(--shadow)}
@media (max-width:720px){.card{padding:18px}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-h h2{font-size:17px}
.card-h .sub{font-size:13px;color:var(--muted)}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);padding:16px 18px;min-width:0;border-radius:var(--r);box-shadow:var(--shadow)}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.stat .d{font-size:12.5px;color:var(--muted);margin-top:2px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .v{font-size:22px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.lg{padding:13px 22px;font-size:15.5px}
.btn.pri{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--ink-2);padding-inline:8px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn svg{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;font-size:inherit}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip.eval{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.ent{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c,var(--muted));flex:0 0 auto}

/* inputs */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.in{width:100%;min-width:0;border:1px solid transparent;background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:16px}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
textarea.in{resize:vertical;min-height:70px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.inline-form .field{flex:1 1 120px}
.inline-form .grow{flex:3 1 200px}

/* week grid */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface-2);border-radius:12px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{background:var(--accent-soft)}
.day.today .day-h b{color:var(--accent)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.day-h b{font-family:var(--f-display);font-size:15px;text-transform:capitalize}
.day-h span{font-size:12px;color:var(--muted)}
.day-add{border:0;background:none;border-radius:8px;color:var(--muted);font-size:12.5px;padding:4px;margin-top:auto;opacity:.7}
.day-add:hover{opacity:1}
.day-add:hover{color:var(--accent);border-color:var(--accent)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.it{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:10px;background:var(--surface);min-width:0}
.it.ev-eval{box-shadow:inset 3px 0 0 var(--bad)}
.it.done .it-title{text-decoration:line-through;color:var(--muted)}
.chk{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:var(--surface);padding:0;display:grid;place-items:center;margin-top:1px}
.chk svg{width:14px;height:14px;opacity:0}
.chk.on{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.chk.on svg{opacity:1}
.it-body{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:1px}
.it-meta{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.it-title{font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.ev{font-size:12px;color:var(--ink-2);padding:2px 2px 2px 8px;border-left:2px solid var(--muted);overflow-wrap:anywhere}
.ev b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted);margin-right:4px}
@media (max-width:1000px){
  .week{grid-template-columns:1fr}
  .day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .day-h{flex:0 0 86px;flex-direction:column;gap:0}
  .day .stack{flex:1;min-width:0}
  .day-add{margin-top:0;flex:0 0 auto;padding:4px 10px}
}
.stack{display:flex;flex-direction:column;gap:6px}

/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.rows .meta{font-size:12.5px;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;padding:0;flex:0 0 auto}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.x svg{width:14px;height:14px}
.count{font-family:var(--f-display);font-size:20px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.count small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}

/* attendance */
.att{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.att button{border:0;background:var(--surface-2);border-radius:10px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.att button b{font-size:12px;text-transform:capitalize;color:var(--ink-2);font-weight:600}
.att button span{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.att button i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal}
.att button i svg{width:12px;height:12px;opacity:0}
.att button.on{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.att button.on b{color:var(--on-fill)}
.att button.on i{border-color:var(--on-fill)}
.att button.on i svg{opacity:1}
.att button.today{outline:2px solid var(--accent);outline-offset:2px}

/* charts */
.bars{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;margin:8px 0 26px}
.bar-col{position:relative;height:100%}
.bar-col:hover .bar{filter:brightness(1.12)}
.bar{position:absolute;left:14%;right:14%;background:var(--mark);border-radius:4px 4px 0 0}
.bar.neg{background:var(--bad);border-radius:0 0 4px 4px}
.bar.cur{background:var(--mark)} .bar.past{opacity:.55}
.bar-x{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bars.dense .bar-x:not(.show){visibility:hidden}
.zero{position:absolute;left:0;right:0;border-top:1px solid var(--ink-2);opacity:.5}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink-2);z-index:1;pointer-events:none}
.goal-line span{position:absolute;right:0;bottom:2px;font-size:10.5px;color:var(--ink-2);background:var(--surface);padding:0 4px;border-radius:4px}
.lc{position:relative;margin:6px 0 26px 44px}
.lc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lc .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.lc .gl span{position:absolute;right:calc(100% + 8px);top:-8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lc .pt{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:2;display:grid;place-items:center}
.lc .pt::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--mark);box-shadow:0 0 0 2px var(--surface)}
.lc .pt.end::after{width:10px;height:10px}
.lc .pt:hover::after{width:10px;height:10px}
.lc .goal-line span{right:auto;left:4px}
.lc .xl{position:absolute;top:calc(100% + 6px);font-size:11px;color:var(--muted);white-space:nowrap}
.lc .endlbl{position:absolute;font-size:12px;font-weight:600;transform:translate(-100%,-150%);white-space:nowrap;background:var(--surface);padding:0 4px;border-radius:4px;z-index:1}
.spark{width:100%;height:34px;display:block;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--mark)}
.legend i.dash{border-top:1.5px dashed var(--ink-2)}
.legend i.sq{width:10px;height:10px;border:0;background:var(--mark);border-radius:2px}
.legend i.sq.neg{background:var(--bad)}

/* exercise cards */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ex{border-radius:14px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;min-width:0}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-h h3{font-size:16px;overflow-wrap:anywhere}
.ex-h .g{font-size:12px;color:var(--muted)}
.ex-kg{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.ex-kg small{font-size:14px;color:var(--ink-2);font-family:var(--f-body);margin-left:3px}
.ex-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.hist{font-size:12.5px;border-top:1px solid var(--line);padding-top:8px}
.hist table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:3px 4px;text-align:left}
.hist th{color:var(--muted);font-weight:500}
.hist td:last-child{text-align:right}

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.goal{border-radius:14px;padding:18px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;min-width:0}
.goal.won{background:var(--good-soft);border-color:transparent}
.goal h3{font-size:17px;overflow-wrap:anywhere}
.goal-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.prog.over i{background:var(--bad)}
.prog i{display:block;height:100%;background:var(--mark);border-radius:999px}
.goal.won .prog i{background:var(--good)}
.prog-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;gap:8px;flex-wrap:wrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;align-items:flex-start;gap:8px;font-size:14px;min-width:0}
.steps li span{flex:1;min-width:0;overflow-wrap:anywhere}
.steps li.done span{text-decoration:line-through;color:var(--muted)}
.mini-add{display:flex;gap:6px}
.mini-add .in{padding:6px 9px;font-size:14px}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:var(--surface-2);max-width:100%}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.wide{display:flex}.seg.wide button{flex:1;padding:10px 8px}

/* empty + banners */
.empty{border-radius:14px;background:var(--surface-2);padding:22px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:17px}
.empty p{margin:0;max-width:52ch}
.empty-s{color:var(--muted);font-size:13.5px;margin:4px 0}
.welcome{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.welcome h2{font-size:20px}
.welcome p{margin:4px 0 0;color:var(--ink-2);max-width:62ch}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.45);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px, env(safe-area-inset-top, 0px));padding-bottom:max(16px, env(safe-area-inset-bottom, 0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;width:100%;max-width:460px;max-height:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media (max-width:720px){.ov{align-items:flex-end;padding:0}.sheet{max-width:none;border-radius:20px 20px 0 0;padding-bottom:max(24px, env(safe-area-inset-bottom, 0px))}}
.sheet h2{font-size:20px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.sheet p{margin:0;color:var(--ink-2);font-size:14px}
.sheet ol{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.sheet pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 var(--f-mono);max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches span{display:block;width:30px;height:30px;border-radius:8px;background:var(--c);border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatches input:checked + span{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}



/* ramos y notas */
.courses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.courses > li{border-top:1px solid var(--line)}
.courses > li:first-child{border-top:0}
.course-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;text-align:left;min-width:0}
.course-row .grow{display:flex;flex-direction:column;flex:1;min-width:0}
.course-row .meta{font-size:12.5px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted);flex:0 0 auto;transition:transform .2s}
.open .chev{transform:rotate(180deg)}
.course-body{display:flex;flex-direction:column;gap:12px;padding:0 0 16px 21px}
.grade{display:inline-grid;place-items:center;min-width:44px;padding:3px 8px;border-radius:8px;font-family:var(--f-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.grade.ok{background:var(--good-soft);color:var(--good)}
.grade.low{background:var(--bad-soft);color:var(--bad)}
.grade.none{color:var(--muted)}
.gtable{width:100%;border-collapse:collapse;font-size:14px}
.gtable th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px 6px 0}
.gtable td{padding:6px 6px 6px 0;border-top:1px solid var(--line);vertical-align:middle}
.gtable td .meta{display:block;font-size:12px;color:var(--muted)}
.gtable tfoot td{font-weight:600;border-top:1.5px solid var(--ink-2)}
.gtable td:last-child{width:32px}
.grade-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:560px){.grade-form{grid-template-columns:1fr 1fr}.grade-form .grow{grid-column:1/-1}.grade-form .btn{grid-column:1/-1}.course-body{padding-left:0}}

/* finanzas: gastos */
.subnav{display:flex;justify-content:center}
.subnav .seg button{padding:8px 18px;font-size:14px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:22px 26px}
.mnav{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.mnav b{font-weight:600;min-width:130px}
.mnav .iconbtn{box-shadow:none;background:var(--surface-2)}
.hero-l{color:var(--muted);font-size:14px}
.hero-v{font-family:var(--f-display);font-weight:600;font-size:46px;line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero-b{width:100%;max-width:420px;margin:6px 0 4px;text-align:left}
.hero .btn.lg{margin-top:12px;min-width:220px}
.tcard{display:flex;flex-direction:column;gap:6px}
.tc-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tc-h .grow{flex:1;min-width:0}
.tc-ico{width:40px;height:40px;border-radius:12px;background:var(--fill);color:var(--on-fill);display:grid;place-items:center;flex:0 0 auto}
.tc-ico svg{width:22px;height:22px}
.tc-v{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;overflow-wrap:anywhere}
.kv{list-style:none;margin:10px 0 4px;padding:0;display:flex;flex-direction:column}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.kv li b{color:var(--ink);font-weight:600}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.cat-l{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.cat-l b{font-weight:600}
.cat-bar{height:6px;border-radius:999px;background:var(--surface-2)}
.cat-bar i{display:block;height:100%;border-radius:999px;background:var(--mark)}
.dgroup + .dgroup{margin-top:14px}
.dg-h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:500;padding-bottom:2px;text-transform:capitalize}
.exp{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:2px 0;text-align:left;min-width:0}
.exp .grow{display:flex;flex-direction:column;min-width:0}
.exp-t{font-size:15px;overflow-wrap:anywhere}
.exp .meta{font-size:12.5px;color:var(--muted)}
.exp b{font-weight:600;white-space:nowrap}
.exp:hover .exp-t{color:var(--accent)}
.flabel{font-size:12.5px;color:var(--ink-2);font-weight:500}
.in.amount{font-family:var(--f-display);font-size:34px;font-weight:600;text-align:center;padding:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;margin:0}
.pill span{display:block;padding:7px 13px;border-radius:999px;background:var(--surface-2);font-size:14px;color:var(--ink-2);cursor:pointer}
.pill input:checked + span{background:var(--fill);color:var(--on-fill)}
.pill input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:max(20px, calc(env(safe-area-inset-right, 0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--fill);color:var(--on-fill);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.fab svg{width:26px;height:26px}
.fab:hover{filter:brightness(1.07)}
@media (max-width:720px){.fab{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}.hero-v{font-size:40px}}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;max-width:240px;white-space:pre-line;line-height:1.35}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:720px){#toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:12.5px}
@media (prefers-reduced-motion: no-preference){ .prog i{transition:width .3s ease} .bar{transition:filter .15s} }
</style>

</head>
<body>
<header class="top wrap">
  <div class="top-row">
    <div class="brand">
      <h1 class="logo" aria-label="Redia"><span class="lw"></span><span class="ll"></span></h1>
      <span class="status" id="status"><i></i><span>Cargando…</span></span>
      <button class="iconbtn quiet" data-a="backupSheet" aria-label="Respaldo de datos" title="Respaldo de datos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
    </div>
    <div class="weeknav" id="weeknav">
      <button class="iconbtn" data-a="week" data-d="-1" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="lbl"><b id="wk-title">Semana</b><span id="wk-range"></span></div>
      <button class="iconbtn" data-a="week" data-d="1" aria-label="Semana siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn" data-a="week" data-d="0" id="wk-today">Hoy</button>
    </div>
  </div>
</header>

<nav class="tabs" aria-label="Secciones">
  <div class="wrap tabs-in" role="tablist">

    <button class="tab" role="tab" data-a="tab" data-t="gym" id="t-gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Gimnasio</button>

<script>
(() => {
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const today = () => iso(new Date());
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const DOW = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const MON = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtD = s => { const d = parse(s); return `${DOW[(d.getDay() + 6) % 7]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const num = (v, dec = 1) => Number(v).toLocaleString('es-CL', { maximumFractionDigits: dec });
const sum = a => a.reduce((x, y) => x + y, 0);
const clone = o => JSON.parse(JSON.stringify(o));
// Acepta "4,2", "4.2", "69,7" y montos con puntos de miles como "50.000"
const parseNum = v => {
  let t = String(v ?? '').trim().replace(/\s|\$/g, '');
  if (!t) return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  return parseFloat(t);
};
const inDays = n => n === 0 ? 'hoy' : n === 1 ? 'mañana' : n < 0 ? `hace ${-n} d` : `en ${n} días`;
const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'
};

/* ---------- datos ---------- */
const DEFAULTS = {
  uni:  { courses: [], items: [], goals: {}, semesterStart: '', passGrade: 4, _t: 0 },
  cal:  { events: [], source: '', importedAt: '', _t: 0 },
  gym:  { weights: [], goalKg: '', attendance: {}, daysGoal: 4, exercises: [], logs: [], _t: 0 },
  vida: { goals: [], focus: {}, _t: 0 },
  fin:  { currency: 'CLP', moves: [], goals: [], budget: '', cards: { credito: { name: 'Tarjeta de crédito', limit: '', closeDay: '', payDay: '' }, debito: { name: 'Tarjeta de débito' } }, _t: 0 }
};
const SECS = Object.keys(DEFAULTS);
const TYPES = { tarea: 'Tarea', prueba: 'Prueba', control: 'Control', entrega: 'Entrega', lectura: 'Lectura', otro: 'Otro' };
const EVAL = new Set(['prueba', 'control']);
const COLORS = ['Azul', 'Naranja', 'Turquesa', 'Amarillo', 'Rosa', 'Verde'];
const AREAS = ['Salud', 'Personal', 'Relaciones', 'Carrera', 'Viajes', 'Otro'];
const CURR = ['CLP', 'USD', 'EUR', 'MXN', 'ARS', 'COP', 'PEN'];
const CATS = ['Comida', 'Transporte', 'Universidad', 'Salidas', 'Compras', 'Suscripciones', 'Salud', 'Hogar', 'Otro'];

const LS = 'bitacora-v1';
let S = { gastos: {} };
let ui = { tab: 'uni', wk: 0, exOpen: '', goalFilter: 'act', finView: 'gastos', gMonth: 0, gCard: 'all' };
try { const c = JSON.parse(localStorage.getItem(LS) || 'null'); if (c) { for (const k of SECS) if (c[k]) S[k] = c[k]; if (c.gastos) S.gastos = c.gastos; } const u = JSON.parse(localStorage.getItem(LS + '-ui') || 'null'); if (u) ui = { ...ui, ...u, wk: 0, gMonth: 0 }; } catch (e) {}
for (const k of SECS) S[k] = { ...clone(DEFAULTS[k]), ...(S[k] || {}) };
S.fin.cards = { ...clone(DEFAULTS.fin.cards), ...(S.fin.cards || {}) };
const h = (location.hash || '').slice(1);
if (h) ui.tab = { uni: 'uni', gym: 'gym', vida: 'vida', finanzas: 'fin' }[h] || ui.tab;

function cacheLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); localStorage.setItem(LS + '-ui', JSON.stringify(ui)); } catch (e) {} }

/* ---------- guardado en la cuenta (db) ----------
   Un documento por sección, y los gastos en un documento por mes (g-AAAA-MM) para que nunca se llenen. */
const isDocKey = k => SECS.includes(k) || /^g-\d{4}-\d{2}$/.test(k);
const getDoc = k => k.startsWith('g-') ? (S.gastos[k.slice(2)] = S.gastos[k.slice(2)] || { items: [], _t: 0 }) : S[k];
function setDoc(k, data) {
  if (k.startsWith('g-')) S.gastos[k.slice(2)] = { items: [], ...clone(data) };
  else { S[k] = { ...clone(DEFAULTS[k]), ...clone(data) }; if (k === 'fin') S.fin.cards = { ...clone(DEFAULTS.fin.cards), ...(S.fin.cards || {}) }; }
}
const docKeys = () => [...SECS, ...Object.keys(S.gastos).map(m => 'g-' + m)];
let db = null, userId = null, mode = 'local', lastErr = '';
const timers = {}, writing = {}, again = {};
function save(k) {
  getDoc(k)._t = Date.now();
  cacheLocal();
  clearTimeout(timers[k]);
  timers[k] = setTimeout(() => { timers[k] = null; flush(k); }, 700);
  setStatus();
}
async function flush(k) {
  if (!db || !userId) { setStatus(); return; }
  if (writing[k]) { again[k] = true; return; }
  writing[k] = true; setStatus();
  try { await db.doc(`data/users/${userId}/${k}`).set(clone(getDoc(k))); lastErr = ''; }
  catch (e) {
    lastErr = e && e.code === 'quota_exceeded' ? 'Se llenó el espacio de guardado' : 'No se pudo guardar en tu cuenta';
    if (e && e.code === 'unavailable') setTimeout(() => flush(k), 1500 + Math.random() * 1500);
  }
  writing[k] = false;
  if (again[k]) { again[k] = false; flush(k); } else setStatus();
}
function setStatus() {
  const el = $('#status'), busy = docKeys().some(k => timers[k] || writing[k]);
  el.className = 'status ' + (lastErr ? 'err' : busy ? 'saving' : mode === 'cloud' ? 'cloud' : '');
  el.lastElementChild.textContent = lastErr || (busy ? 'Guardando…' : mode === 'cloud' ? 'Guardado en tu cuenta' : 'Guardado en este navegador');
}
async function connect() {
  if (!window.claude || !window.claude.use) { setStatus(); return; }
  let d, u;
  try { [d, u] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) {}
  if (!d || !u) { setStatus(); return; }
  const id = await u.id();
  if (!id) { setStatus(); return; }
  db = d; userId = id; mode = 'cloud';
  const col = db.collection(`data/users/${id}`);
  try {
    const qs = await col.get(), seen = new Set();
    for (const snap of qs.docs) {
      const k = snap.id; if (!isDocKey(k)) continue;
      seen.add(k);
      const data = snap.data();
      if ((data._t || 0) >= (getDoc(k)._t || 0)) setDoc(k, data); else flush(k);
    }
    for (const k of docKeys()) if (!seen.has(k) && getDoc(k)._t) flush(k);
  } catch (e) {}
  col.onSnapshot(qs => {
    let changed = false;
    for (const c of qs.docChanges()) {
      const snap = c.doc, k = snap.id;
      if (c.type === 'removed' || !isDocKey(k) || snap.metadata.hasPendingWrites || timers[k] || writing[k]) continue;
      const data = snap.data();
      if ((data._t || 0) > (getDoc(k)._t || 0)) { setDoc(k, data); changed = true; }
    }
    if (changed) { cacheLocal(); render(); }
  }, () => {});
  cacheLocal(); render(); setStatus();
}

/* ---------- semana ---------- */
const curMon = () => addDays(mondayOf(new Date()), ui.wk * 7);
const wkKey = () => iso(curMon());
function semWeek(mon) {
  if (!S.uni.semesterStart) return null;
  const n = Math.floor(diffDays(iso(mondayOf(parse(S.uni.semesterStart))), iso(mon)) / 7) + 1;
  return n >= 1 && n <= 30 ? n : null;
}
function renderWeekNav() {
  const mon = curMon(), sun = addDays(mon, 6), n = semWeek(mon);
  const same = mon.getMonth() === sun.getMonth();
  $('#wk-title').textContent = n ? `Semana ${n} del semestre` : ui.wk === 0 ? 'Esta semana' : ui.wk === 1 ? 'Próxima semana' : ui.wk === -1 ? 'Semana pasada' : `Semana del ${fmtShort(iso(mon))}`;
  $('#wk-range').textContent = same ? `${mon.getDate()} – ${sun.getDate()} ${MON[sun.getMonth()]} ${sun.getFullYear()}` : `${mon.getDate()} ${MON[mon.getMonth()]} – ${sun.getDate()} ${MON[sun.getMonth()]}`;
  $('#weeknav').hidden = ui.tab === 'fin';
  $('#wk-today').disabled = ui.wk === 0;
}

/* ---------- gráficos ---------- */
function niceStep(r) { const p = Math.pow(10, Math.floor(Math.log10(r || 1))); const m = r / p; return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; }
function bars(data, { goal = 0, height = 140, fmt = v => v, goalLbl = 'Meta' } = {}) {
  const vals = data.map(d => d.v);
  let max = Math.max(0, ...vals, goal || 0), min = Math.min(0, ...vals);
  if (max === min) max = min + 1;
  const y = v => ((max - v) / (max - min)) * 100, z = y(0);
  const dense = data.length > 8;
  return `<div class="bars ${dense ? 'dense' : ''}" style="height:${height}px">
    ${goal ? `<div class="goal-line" style="top:${y(goal)}%"><span>${goalLbl} ${esc(fmt(goal))}</span></div>` : ''}
    <div class="zero" style="top:${z}%"></div>
    ${data.map((d, i) => { const top = Math.min(y(d.v), z), hh = Math.abs(y(d.v) - z);
      return `<div class="bar-col" data-tip="${esc(d.tip)}"><div class="bar ${d.v < 0 ? 'neg' : ''} ${d.cls || ''}" style="top:${top}%;height:${hh}%"></div><span class="bar-x ${(!dense || i % 3 === (data.length - 1) % 3) ? 'show' : ''}">${esc(d.x)}</span></div>`; }).join('')}
  </div>`;
}
function lineChart(pts, { goal = null, unit = '', height = 190 } = {}) {
  if (pts.length < 2) return `<p class="empty-s">Registra al menos dos pesajes para ver la curva.</p>`;
  const xs = pts.map(p => parse(p.d).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs);
  let ys = pts.map(p => p.v); if (goal) ys = ys.concat(goal);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const step = niceStep(Math.max(hi - lo, 1) / 3);
  lo = Math.floor((lo - step * 0.3) / step) * step; hi = Math.ceil((hi + step * 0.3) / step) * step;
  const X = t => ((t - x0) / (x1 - x0 || 1)) * 100, Y = v => ((hi - v) / (hi - lo)) * 100;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(2)},${Y(p.v).toFixed(2)}`).join(' ');
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(v);
  const last = pts[pts.length - 1];
  return `<div class="lc" style="height:${height}px">
    ${ticks.map(v => `<div class="gl" style="top:${Y(v)}%"><span>${num(v)}</span></div>`).join('')}
    ${goal ? `<div class="goal-line" style="top:${Y(goal)}%"><span>Meta ${num(goal)} ${unit}</span></div>` : ''}
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="${line} L100,100 L0,100 Z" fill="var(--mark)" fill-opacity=".1" stroke="none"/>
      <path d="${line}" fill="none" stroke="var(--mark)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    ${pts.map((p, i) => `<span class="pt ${i === pts.length - 1 ? 'end' : ''}" style="left:${X(xs[i])}%;top:${Y(p.v)}%" data-tip="${esc(fmtD(p.d))}\n${num(p.v)} ${unit}"></span>`).join('')}
    <span class="endlbl num" style="left:${X(xs[xs.length - 1])}%;top:${Y(last.v)}%">${num(last.v)} ${unit}</span>
    <span class="xl" style="left:0">${fmtShort(pts[0].d)}</span>
    <span class="xl" style="right:0">${fmtShort(last.d)}</span>
  </div>`;
}
function spark(vals) {
  if (vals.length < 2) return '';
  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const p = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(2)},${(90 - (v - lo) / r * 80).toFixed(2)}`).join(' ');
  const [lx, ly] = p.split(' ').pop().split(',');
  return `<svg class="spark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p}" fill="none" stroke="var(--mark)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="3" fill="var(--mark)" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- UNIVERSIDAD ---------- */
const course = id => S.uni.courses.find(c => c.id === id);
const cVar = c => c ? `--c:var(--c${(c.color % 6) + 1})` : '';
function itemHTML(it, showDate) {
  const c = course(it.courseId);
  const cls = EVAL.has(it.type) ? 'eval' : it.type === 'entrega' ? 'ent' : '';
  return `<li class="it ${it.done ? 'done' : ''} ${EVAL.has(it.type) && !it.done ? 'ev-eval' : ''}">
    <button class="chk ${it.done ? 'on' : ''}" data-a="toggleItem" data-id="${it.id}" aria-label="${it.done ? 'Marcar pendiente' : 'Marcar hecha'}: ${esc(it.title)}">${I.check}</button>
    <button class="it-body" data-a="editItem" data-id="${it.id}">
      <span class="it-meta">${it.type !== 'tarea' ? `<span class="chip ${cls}">${TYPES[it.type] || 'Otro'}</span>` : ''}${c ? `<i class="dot" style="${cVar(c)}"></i>${esc(c.name)}` : ''}${it.time ? ` · <span class="num">${esc(it.time)}</span>` : ''}${showDate ? ` · ${fmtD(it.date)}` : ''}</span>
      <span class="it-title">${esc(it.title)}</span>
    </button>
  </li>`;
}
/* Notas: escala chilena 1,0–7,0. Ponderado si todas las notas tienen %, si no promedio simple. */
const g1 = v => (Math.round(v * 10) / 10).toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const passG = () => +S.uni.passGrade || 4;
function courseGrades(c) {
  const gs = c.grades || [], pass = passG();
  if (!gs.length) return { gs, avg: null };
  const weighted = gs.every(g => +g.weight > 0);
  if (!weighted) return { gs, avg: sum(gs.map(g => +g.grade)) / gs.length, weighted };
  const W = sum(gs.map(g => +g.weight)), avgNow = sum(gs.map(g => g.grade * g.weight)) / W;
  const R = 100 - W;
  let need = null;
  if (R > 0.0001 && W < 100) need = (pass * 100 - sum(gs.map(g => g.grade * g.weight))) / R;
  return { gs, avg: avgNow, weighted, W, R, need, final: W >= 99.95 };
}
function gradeChip(v) { return v == null ? '' : `<span class="grade ${v >= passG() ? 'ok' : 'low'}">${g1(v)}</span>`; }
function needText(r) {
  const pass = g1(passG());
  if (!r.gs.length) return 'Sin notas todavía';
  if (!r.weighted) return `Promedio simple de ${r.gs.length} nota${r.gs.length === 1 ? '' : 's'}. Agrega el % de cada una para saber cuánto necesitas.`;
  if (r.final) return r.avg >= passG() ? `Nota final. Aprobado con ${g1(r.avg)}.` : `Nota final ${g1(r.avg)}, bajo el ${pass}.`;
  if (r.need <= 1) return `Ya tienes el ${pass} asegurado. Falta un ${num(r.R, 0)}% del ramo.`;
  if (r.need > 7) return `Ni con 7,0 en el ${num(r.R, 0)}% que queda llegas al ${pass}.`;
  return `Necesitas un <b>${g1(r.need)}</b> promedio en el ${num(r.R, 0)}% que queda para aprobar con ${pass}.`;
}
function renderUni() {
  const u = S.uni, mon = curMon(), wk = iso(mon), days = [...Array(7)].map((_, i) => iso(addDays(mon, i))), end = days[6], t = today();
  const wItems = u.items.filter(i => i.date >= wk && i.date <= end);
  const pend = wItems.filter(i => !i.done).length;
  const goals = u.goals[wk] || [];
  const upcoming = u.items.filter(i => !i.done && i.date >= t && (EVAL.has(i.type) || i.type === 'entrega')).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const evals14 = upcoming.filter(i => EVAL.has(i.type) && diffDays(t, i.date) <= 14).length;
  const overdue = u.items.filter(i => !i.done && i.date < t).sort((a, b) => b.date.localeCompare(a.date));
  const events = S.cal.events || [];
  const fresh = !u.courses.length && !u.items.length;

  let html = '';
  if (fresh) html += `<div class="welcome"><div><h2>Arma tu semestre</h2><p>Agrega tus ramos y luego tus tareas, controles y pruebas. Si usas Apple Calendar, importa tu horario para verlo junto a tus pendientes.</p></div>
    <div class="btns"><button class="btn pri" data-a="addCourse">${I.plus} Agregar ramo</button><button class="btn" data-a="sample">Ver con datos de ejemplo</button></div></div>`;

  html += `<div class="stats">
    <div class="stat"><div class="eyebrow">Pendientes semana</div><div class="v">${pend}</div><div class="d">${wItems.length - pend} hechas de ${wItems.length}</div></div>
    <div class="stat"><div class="eyebrow">Evaluaciones 14 días</div><div class="v">${evals14}</div><div class="d">${upcoming[0] ? `Próxima ${inDays(diffDays(t, upcoming[0].date))}` : 'Nada agendado'}</div></div>
    <div class="stat"><div class="eyebrow">Metas de la semana</div><div class="v">${goals.filter(g => g.done).length}/${goals.length}</div><div class="d">${goals.length ? Math.round(goals.filter(g => g.done).length / goals.length * 100) + '% cumplido' : 'Sin metas aún'}</div></div>
    ${(() => { const avgs = u.courses.map(c => courseGrades(c).avg).filter(v => v != null), gen = avgs.length ? sum(avgs) / avgs.length : null;
      return `<div class="stat"><div class="eyebrow">Promedio general</div><div class="v" style="color:${gen != null && gen < passG() ? 'var(--bad)' : 'inherit'}">${gen != null ? g1(gen) : '—'}</div><div class="d">${gen != null ? `De ${avgs.length} ramo${avgs.length === 1 ? '' : 's'} con notas` : 'Agrega notas en tus ramos'}</div></div>`; })()}
  </div>`;

  html += `<div class="card"><div class="card-h"><div><h2>Semana</h2><div class="sub">${events.length ? `Incluye ${events.length} eventos importados de tu calendario` : 'Toca un día para agregar algo'}</div></div>
    <div class="btns"><button class="btn pri" data-a="addItem">${I.plus} Agregar</button><button class="btn" data-a="calSheet">${I.cal} Apple Calendar</button></div></div>
    <div class="week">${days.map((d, i) => {

        <div><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="prog-l" style="margin-top:4px"><span>${dn}/${st.length} pasos</span><span>${pct}%</span></div></div>
        ${st.length ? `<ul class="steps">${st.map(s => `<li class="${s.done ? 'done' : ''}"><button class="chk ${s.done ? 'on' : ''}" data-a="toggleStep" data-g="${g.id}" data-id="${s.id}" aria-label="Marcar paso">${I.check}</button><span>${esc(s.text)}</span><button class="x" data-a="delStep" data-g="${g.id}" data-id="${s.id}" aria-label="Quitar paso">${I.x}</button></li>`).join('')}</ul>` : ''}

        <div class="btns"><button class="btn ghost" data-a="editGoal" data-id="${g.id}">Editar</button><button class="btn ${g.done ? 'ghost' : ''}" data-a="wonGoal" data-id="${g.id}">${g.done ? 'Reabrir' : 'Marcar lograda'}</button></div></article>`; }).join('')}</div>`

/* ---------- FINANZAS ---------- */
const money = n => { const c = S.fin.currency; try { return new Intl.NumberFormat('es-CL', { style: 'currency', currency: c, maximumFractionDigits: ['CLP', 'COP', 'ARS'].includes(c) ? 0 : 2 }).format(n); } catch (e) { return num(n, 2) + ' ' + c; } };
const signed = m => m.kind === 'retiro' ? -Math.abs(+m.amount) : Math.abs(+m.amount);
const shortMoney = n => { const a = Math.abs(n); return (n < 0 ? '−' : '') + (a >= 1e6 ? num(a / 1e6) + ' M' : a >= 1e3 ? num(a / 1e3, 0) + ' mil' : num(a, 0)); };
function ahorroHTML() {
  const f = S.fin, t = today(), ym = t.slice(0, 7);

  const months = [...Array(12)].map((_, i) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 11 + i); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; });

  html += `<div class="stats">

    <div class="stat"><div class="eyebrow">Promedio mensual</div><div class="v">${money(Math.round(avg6))}</div><div class="d">Últimos 6 meses cerrados</div></div>

  </div>

      ${f.moves.length ? bars(months.map((m, i) => ({ v: mVals[i], x: MON[+m.slice(5) - 1], tip: `${MON[+m.slice(5) - 1]} ${m.slice(0, 4)}\n${money(mVals[i])}`, cls: m === ym ? 'cur' : '' })), { height: 160, fmt: shortMoney }) + `<div class="legend"><span><i class="sq"></i>Mes con ahorro</span><span><i class="sq neg"></i>Mes con más retiros</span></div>` : '<p class="empty-s">El gráfico aparece con tu primer movimiento.</p>'}
    </div>
    <div class="card span-5"><div class="card-h"><h2>Nuevo movimiento</h2></div>
      <form class="stack" data-f="move" style="gap:10px">
        <div class="seg" role="group" aria-label="Tipo"><button type="button" data-a="moveKind" data-v="ahorro" aria-pressed="${(ui.moveKind || 'ahorro') === 'ahorro'}">Ahorro</button><button type="button" data-a="moveKind" data-v="retiro" aria-pressed="${ui.moveKind === 'retiro'}">Retiro</button></div>
        <div class="inline-form"><div class="field"><label for="m-amount">Monto (${f.currency})</label><input class="in num" id="m-amount" type="text" min="0" step="any" inputmode="decimal" required placeholder="50000"></div><div class="field"><label for="m-date">Fecha</label><input class="in" id="m-date" type="date" value="${t}" required></div></div>
        <div class="inline-form"><div class="field"><label for="m-goal">Meta</label><select class="in" id="m-goal"><option value="">Sin meta</option>${f.goals.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="field grow"><label for="m-note">Nota</label><input class="in" id="m-note" maxlength="80" placeholder="Ej.: sueldo práctica"></div></div>
        <div><button class="btn pri">Guardar movimiento</button></div>
      </form>

      ${f.goals.length ? `<div class="goals">${f.goals.map(g => { const s = goalSaved(g.id), pct = g.target ? Math.min(100, Math.max(0, Math.round(s / g.target * 100))) : 0, left = Math.max(0, g.target - s);
        const ml = g.deadline ? Math.max(1, (parse(g.deadline).getFullYear() - new Date().getFullYear()) * 12 + parse(g.deadline).getMonth() - new Date().getMonth()) : null;

          <div class="ex-kg" style="font-size:24px">${money(s)}<small>de ${money(g.target)}</small></div>
          <div><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="prog-l" style="margin-top:4px"><span>${pct}%</span><span>Faltan ${money(left)}</span></div></div>

      ${f.moves.length ? `<ul class="rows">${[...f.moves].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30).map(m => { const g = f.goals.find(x => x.id === m.goalId);

  return html;
}
function fGoalForm(g) {
  const isNew = !g; g = g || { name: '', target: '', deadline: '' };

/* ---------- GASTOS (tarjetas de crédito y débito) ---------- */
const MONTHS_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const allExp = () => Object.values(S.gastos).flatMap(d => d.items || []);
const addMonths = (s, n) => { const d = parse(s), day = d.getDate(), x = new Date(d.getFullYear(), d.getMonth() + n, 1); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return iso(x); };
const monthKey = off => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };

  const id = 'f_' + f.k, v = f.v ?? '';
  if (f.type === 'select') return `<div class="field"><label for="${id}">${f.label}</label><select class="in" id="${id}">${f.opts.map(([val, l]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
  if (f.type === 'textarea') return `<div class="field"><label for="${id}">${f.label}</label><textarea class="in" id="${id}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea></div>`;
  if (f.type === 'swatch') return `<fieldset class="field" style="border:0;padding:0;margin:0"><legend style="font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:6px">${f.label}</legend><div class="swatches">${COLORS.map((n, i) => `<label title="${n}"><input type="radio" name="${id}" value="${i}" ${+v === i ? 'checked' : ''} aria-label="${n}"><span style="--c:var(--c${i + 1})"></span></label>`).join('')}</div></fieldset>`;
  return `<div class="field"><label for="${id}">${f.label}</label><input class="in ${f.type === 'number' ? 'num' : ''}" id="${id}" type="${f.type === 'number' ? 'text' : f.type}" value="${esc(f.type === 'number' && v !== '' ? String(v).replace('.', ',') : v)}" ${f.req ? 'required' : ''} ${f.type === 'number' ? `inputmode="${f.step === '1' ? 'numeric' : 'decimal'}" autocomplete="off"` : ''} placeholder="${esc(f.ph || '')}" ${f.type === 'text' ? 'maxlength="160"' : ''}></div>`;
}
const walk2 = (fs, fn) => fs.forEach(f => f.row ? walk2(f.row, fn) : fn(f));
function openForm(cfg) {
  formCfg = cfg;
  openSheet(`<form class="stack" id="gform" style="gap:14px"><h2>${cfg.title}</h2>${cfg.fields.map(fieldHTML).join('')}
    <div class="foot">${cfg.onDelete ? `<button type="button" class="btn danger" data-a="formDel" id="delbtn">Eliminar</button>` : '<span></span>'}<div class="btns"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn pri">${cfg.submit}</button></div></div></form>`);
  $('#gform').addEventListener('submit', e => {
    e.preventDefault();
    const v = {}, walk = fs => fs.forEach(f => { if (f.row) return walk(f.row); if (f.type === 'swatch') v[f.k] = ($(`input[name="f_${f.k}"]:checked`) || {}).value ?? 0; else if (f.type === 'number') { const n = parseNum($('#f_' + f.k).value); v[f.k] = isNaN(n) ? '' : n; } else v[f.k] = $('#f_' + f.k).value.trim(); });
    walk(cfg.fields);
    const bad = []; walk2(cfg.fields, f => { if (f.type === 'number' && f.req && v[f.k] === '') bad.push(f.label); });
    if (bad.length) { toast('Revisa el número en: ' + bad[0]); return; } cfg.onSubmit(v); closeSheet(); render();
  });
}

/* ---------- acciones ---------- */
const findGoal = id => S.vida.goals.find(g => g.id === id);
const A = {
  tab: d => { ui.tab = d.t; cacheLocal(); render(); window.scrollTo(0, 0); },
  week: d => { ui.wk = +d.d === 0 ? 0 : ui.wk + +d.d; render(); },
  close: () => closeSheet(),
  sample: () => loadSample(),
  clearSample: () => clearSample(),
  addItem: d => itemForm(null, d.date),
  editItem: d => itemForm(S.uni.items.find(i => i.id === d.id)),
  toggleItem: d => { const i = S.uni.items.find(x => x.id === d.id); i.done = !i.done; save('uni'); render(); },
  addCourse: () => courseForm(),
  editCourse: d => courseForm(S.uni.courses.find(c => c.id === d.id)),
  toggleWGoal: d => { const g = (S.uni.goals[wkKey()] || []).find(x => x.id === d.id); g.done = !g.done; save('uni'); render(); },
  delWGoal: d => { S.uni.goals[wkKey()] = (S.uni.goals[wkKey()] || []).filter(x => x.id !== d.id); save('uni'); render(); },
  carryGoals: () => { const k = wkKey(), prev = S.uni.goals[iso(addDays(curMon(), -7))] || []; S.uni.goals[k] = [...(S.uni.goals[k] || []), ...prev.filter(g => !g.done).map(g => ({ ...g, id: uid() }))]; save('uni'); render(); },
  semSettings: () => openForm({ title: 'Semestre', fields: [{ k: 'semesterStart', label: 'Fecha de inicio de clases', type: 'date', v: S.uni.semesterStart }, { k: 'passGrade', label: 'Nota mínima para aprobar (escala 1,0 a 7,0)', type: 'number', v: passG(), step: '0.1' }], submit: 'Guardar', onSubmit: v => { S.uni.semesterStart = v.semesterStart; S.uni.passGrade = Math.min(7, Math.max(1, +String(v.passGrade).replace(',', '.') || 4)); save('uni'); } }),
  courseOpen: d => { ui.courseOpen = ui.courseOpen === d.id ? '' : d.id; render(); },
  delGrade: d => { const c = course(d.c); c.grades = (c.grades || []).filter(g => g.id !== d.id); save('uni'); render(); },
  calSheet: () => calSheet(),
  calRange: d => calSheet(d.r),
  icsSave: d => icsSave(d.r),
  icsCopy: d => icsCopy(d.r),
  icsImport: () => $('#icsfile').click(),
  icsClear: () => { S.cal = { ...clone(DEFAULTS.cal) }; save('cal'); closeSheet(); render(); toast('Eventos importados quitados'); },
  toggleAtt: d => { if (S.gym.attendance[d.d]) delete S.gym.attendance[d.d]; else S.gym.attendance[d.d] = 1; save('gym'); render(); },
  gymSettings: () => openForm({ title: 'Metas del gimnasio', fields: [{ row: [{ k: 'daysGoal', label: 'Días por semana', type: 'number', v: S.gym.daysGoal, req: true, step: '1' }, { k: 'goalKg', label: 'Peso meta (kg)', type: 'number', v: S.gym.goalKg, step: '0.1' }] }], submit: 'Guardar', onSubmit: v => { S.gym.daysGoal = Math.min(7, Math.max(1, Math.round(+v.daysGoal || 1))); S.gym.goalKg = v.goalKg ? +v.goalKg : ''; save('gym'); } }),
  delWeight: d => { S.gym.weights = S.gym.weights.filter(w => w.id !== d.id); save('gym'); render(); },
  addEx: () => exForm(),
  editEx: d => exForm(S.gym.exercises.find(e => e.id === d.id)),
  addLog: d => logForm(d.id),
  delLog: d => { S.gym.logs = S.gym.logs.filter(l => l.id !== d.id); save('gym'); render(); },
  exHist: d => { ui.exOpen = ui.exOpen === d.id ? '' : d.id; render(); },
  goalFilter: d => { ui.goalFilter = d.v; render(); },
  addGoal: () => goalForm(),
  editGoal: d => goalForm(findGoal(d.id)),
  wonGoal: d => { const g = findGoal(d.id); g.done = !g.done; save('vida'); render(); if (g.done) toast('¡Meta lograda!'); },
  toggleStep: d => { const s = findGoal(d.g).steps.find(x => x.id === d.id); s.done = !s.done; save('vida'); render(); },
  delStep: d => { const g = findGoal(d.g); g.steps = g.steps.filter(x => x.id !== d.id); save('vida'); render(); },
  moveKind: d => { ui.moveKind = d.v; document.querySelectorAll('[data-a="moveKind"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.v)); },
  moveTo: d => { $('#m-goal').value = d.id; ui.moveKind = 'ahorro'; A.moveKind({ v: 'ahorro' }); $('#m-amount').focus(); $('#m-amount').scrollIntoView({ block: 'center', behavior: 'smooth' }); },
  delMove: d => { S.fin.moves = S.fin.moves.filter(m => m.id !== d.id); save('fin'); render(); },
  addFGoal: () => fGoalForm(),
  backupSheet: () => backupSheet(),
  bkSave: () => bkSave(),
  bkLoad: () => $('#bkfile').click(),
  finView: d => { ui.finView = d.v; cacheLocal(); render(); },
  gMonth: d => { ui.gMonth = Math.min(0, ui.gMonth + +d.d); render(); },
  gCard: d => { ui.gCard = d.v; render(); },
  addExp: () => expSheet(),
  editExp: d => expSheet(allExp().find(e => e.id === d.id)),
  expCard: d => { $('#eform').dataset.card = d.v; document.querySelectorAll('[data-a="expCard"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.v)); $('#cuotas-f').hidden = d.v !== 'credito'; },
  budget: () => openForm({ title: 'Presupuesto mensual', fields: [{ k: 'budget', label: `Cuánto quieres gastar al mes como máximo (${S.fin.currency})`, type: 'number', v: S.fin.budget, step: 'any' }], submit: 'Guardar', onSubmit: v => { S.fin.budget = v.budget ? Math.abs(+v.budget) : ''; save('fin'); } }),
  cardSettings: d => { const c = S.fin.cards[d.k];
    openForm({ title: d.k === 'credito' ? 'Tarjeta de crédito' : 'Tarjeta de débito',
      fields: d.k === 'credito' ? [{ k: 'name', label: 'Nombre', type: 'text', v: c.name, req: true, ph: 'Ej.: Visa Banco' }, { k: 'limit', label: `Cupo total (${S.fin.currency})`, type: 'number', v: c.limit, step: 'any' }, { row: [{ k: 'closeDay', label: 'Día de cierre (facturación)', type: 'number', v: c.closeDay, step: '1', ph: '20' }, { k: 'payDay', label: 'Día de pago', type: 'number', v: c.payDay, step: '1', ph: '5' }] }]
        : [{ k: 'name', label: 'Nombre', type: 'text', v: c.name, req: true, ph: 'Ej.: Cuenta RUT' }],
      submit: 'Guardar', onSubmit: v => { const n = (x, max) => x ? Math.min(max, Math.max(1, Math.round(+x))) : ''; if (d.k === 'credito') S.fin.cards.credito = { name: v.name, limit: v.limit ? Math.abs(+v.limit) : '', closeDay: n(v.closeDay, 28), payDay: n(v.payDay, 31) }; else S.fin.cards.debito = { name: v.name }; save('fin'); } }); },
  fab: () => ({ uni: () => itemForm(), gym: () => S.gym.exercises.length ? logForm() : exForm(), vida: () => goalForm(), fin: () => ui.finView === 'ahorro' ? (A.moveKind({ v: 'ahorro' }), $('#m-amount').focus(), $('#m-amount').scrollIntoView({ block: 'center', behavior: 'smooth' })) : expSheet() })[ui.tab](),
  editFGoal: d => fGoalForm(S.fin.goals.find(g => g.id === d.id)),
  finSettings: () => openForm({ title: 'Moneda', fields: [{ k: 'currency', label: 'Moneda de tus ahorros', type: 'select', v: S.fin.currency, opts: CURR.map(c => [c, c]) }], submit: 'Guardar', onSubmit: v => { S.fin.currency = v.currency; save('fin'); } }),
  formDel: (d, b) => {
    if (b.dataset.armed) { formCfg.onDelete(); closeSheet(); render(); toast('Eliminado'); return; }
    b.dataset.armed = '1'; b.textContent = 'Confirmar eliminación';
    if (formCfg.delNote) { const p = document.createElement('p'); p.className = 'small'; p.textContent = formCfg.delNote; b.closest('.foot').before(p); }
  }
};
const F = {
  grade: f => {
    const c = course(f.dataset.c), id = c.id;
    const grade = parseNum($('#gg-' + id).value), w = parseNum($('#gw-' + id).value);
    if (!(grade >= 1 && grade <= 7)) { toast('La nota tiene que estar entre 1,0 y 7,0'); return; }
    const used = sum((c.grades || []).map(g => +g.weight || 0));
    if (w > 0 && used + w > 100.01) { toast(`Te pasas del 100%: ya llevas ${num(used, 1)}%`); return; }
    (c.grades = c.grades || []).push({ id: uid(), name: $('#gn-' + id).value.trim(), grade: Math.round(grade * 10) / 10, weight: w > 0 ? w : '', date: today() });
    save('uni'); render(); $('#gn-' + id)?.focus(); toast(`Nota ${g1(grade)} guardada`);
  },
  wgoal: f => { const inp = $('#wgoal-in'), v = inp.value.trim(); if (!v) return; const k = wkKey(); (S.uni.goals[k] = S.uni.goals[k] || []).push({ id: uid(), text: v, done: false }); save('uni'); render(); $('#wgoal-in').focus(); },
  weight: () => { const kg = parseNum($('#w-kg').value), date = $('#w-date').value; if (!(kg >= 20 && kg <= 400) || !date) { toast('Escribe tu peso en kg, por ejemplo 69,7'); return; } S.gym.weights = S.gym.weights.filter(w => w.date !== date); S.gym.weights.push({ id: uid(), date, kg }); save('gym'); render(); toast('Peso guardado'); },
  step: f => { const g = findGoal(f.dataset.g), inp = $('#step-' + g.id), v = inp.value.trim(); if (!v) return; g.steps.push({ id: uid(), text: v, done: false }); save('vida'); render(); $('#step-' + g.id)?.focus(); },
  move: () => { const amount = Math.abs(parseNum($('#m-amount').value)); if (!amount) return; S.fin.moves.push({ id: uid(), date: $('#m-date').value || today(), amount, kind: ui.moveKind || 'ahorro', goalId: $('#m-goal').value, note: $('#m-note').value.trim() }); save('fin'); render(); toast('Movimiento guardado'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const fn = A[b.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(b.dataset, b, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault(); F[f.dataset.f]?.(f); });
$('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ov').hidden) closeSheet(); });
let focusT = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'focus-in') return;
  const k = e.target.dataset.k, v = e.target.value;
  clearTimeout(focusT); focusT = setTimeout(() => { if (v.trim()) S.vida.focus[k] = v; else delete S.vida.focus[k]; save('vida'); }, 500);
});
$('#icsfile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const r = importIcs(await file.text(), file.name.replace(/\.ics$/i, ''));
    closeSheet(); render();
    toast(r.n ? `Importados ${r.n} eventos${r.total > r.n ? ` (de ${r.total})` : ''}` : 'El archivo no tiene eventos en los próximos meses');
  } catch (err) { toast('No pude leer ese archivo. Revisa que sea un .ics de Calendario.'); }
});

$('#bkfile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) bkLoad(f); });

/* tooltip */
const tip = $('#tip');
document.addEventListener('pointerover', e => { const t = e.target.closest('[data-tip]'); if (!t || !t.dataset.tip) return; tip.textContent = t.dataset.tip; tip.hidden = false; });
document.addEventListener('pointermove', e => { if (tip.hidden) return; const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - tip.offsetHeight - 12) + 'px'; });
document.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) tip.hidden = true; });
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- render ---------- */
function render() {
  for (const t of ['uni', 'gym', 'vida', 'fin']) { $('#p-' + t).hidden = ui.tab !== t; $('#t-' + t).setAttribute('aria-selected', ui.tab === t); }
  renderWeekNav();
  $('#banner').innerHTML = hasSample() ? `<div class="banner" style="margin-bottom:20px"><span>Estás viendo <b>datos de ejemplo</b>. Lo que agregues tú se mantiene al borrarlos.</span><button class="btn" data-a="clearSample">Borrar ejemplos</button></div>` : '';
  ({ uni: renderUni, gym: renderGym, vida: renderVida, fin: renderFin })[ui.tab]();
}
render(); setStatus();
connect();
if (!inClaude && 'serviceWorker' in navigator && location.protocol === 'https:') {
  // Cuando llega una versión nueva de la app, recarga una vez para usarla
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {});
}
})();
</script>
